name: Publish java libs
on:
  workflow_call:
    inputs:
      version:
        description: 'Version'
        required: false
        type: string


jobs:
  publish-java-libs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4

      - name: Set up the JDK used to run Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Build java
        run: |
          if [ "${{ inputs.version }}" != '' ]; then
            NEW_VERSION=${{ inputs.version }}
          elif [[ ${{ github.event_name }} == 'pull_request' ]]; then
            NEW_VERSION=0.1.pr-${{ github.event.number }}.${{ github.run_number }}-${{ github.run_attempt }}
          else
            NEW_VERSION=0.1.$(echo ${{ github.ref }} | cut -d'/' -f3).${{ github.sha }}
          fi
          echo "New version: ${NEW_VERSION}"
          echo "Github username: ${GITHUB_ACTOR}"
          ./gradlew -Pversion=${NEW_VERSION} build

      - name: Publish package
        run: |
          if [ "${{ inputs.version }}" != '' ]; then
            NEW_VERSION=${{ inputs.version }}
          elif [[ ${{ github.event_name }} == 'pull_request' ]]; then
            NEW_VERSION=0.1.pr-${{ github.event.number }}.${{ github.run_number }}-${{ github.run_attempt }}
          else
            NEW_VERSION=0.1.$(echo ${{ github.ref }} | cut -d'/' -f3).${{ github.sha }}
          fi
          echo "New version: ${NEW_VERSION}"
          echo "Github username: ${GITHUB_ACTOR}"
          ./gradlew -Pversion=${NEW_VERSION} publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}