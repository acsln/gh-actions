name: Publish java libs
on:
  workflow_call:
    inputs:
      version:
        description: 'Version'
        required: true
        type: string


jobs:
  publish-java-libs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Build Java
        uses: acsln/gh-actions/.github/workflows/java-build.yaml@dev

      - name: Publish package
        run: |
          NEW_VERSION=${{ inputs.version }}
          echo "New version: ${NEW_VERSION}"
          echo "Github username: ${GITHUB_ACTOR}"
          ./gradlew -Pversion=${NEW_VERSION} publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}